name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（workflow_dispatch 时用于制品命名）
        required: true

permissions:
  contents: write
  packages: write

jobs:
  backend:
    name: 后端 · 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -DskipTests package
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/backend-*.jar
          if-no-files-found: error

  frontend:
    name: 管理端 · 打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  client:
    name: 客户端 · APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - name: flutter build apk
        working-directory: client
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.APK_API_BASE_URL || 'http://10.0.2.2:8125/api' }}
      - uses: actions/upload-artifact@v4
        with:
          name: client-apk
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  docker:
    name: 镜像 · ghcr
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
      - name: frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}

  release:
    name: 发布制品
    runs-on: ubuntu-latest
    needs: [backend, frontend, client]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 阅有期 ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/backend-jar/*.jar
            artifacts/client-apk/*.apk


