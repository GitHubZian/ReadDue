name: CI

on:
  push:
    branches: [main, dev, prod, "feat/**", "fix/**", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    env:
      TZ: Asia/Shanghai
    name: 后端 · 测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: readdue
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: mvn verify
        working-directory: backend
        run: mvn -B -ntp verify
        env:
          APP_DEMO_ENABLED: "true"
          APP_JWT_SECRET: "ci-only-0123456789abcdef0123456789abcdef0123456789abcdef"
          APP_AUTH_LOGINRATELIMIT_ENABLED: "false"
          SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/readdue?useUnicode=true&characterEncoding=utf-8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true"
          SPRING_DATASOURCE_USERNAME: "root"
          SPRING_DATASOURCE_PASSWORD: "123456"
          SPRING_DATA_REDIS_HOST: "127.0.0.1"
          SPRING_RABBITMQ_HOST: "127.0.0.1"

  frontend:
    name: 管理端 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: pnpm build
        working-directory: frontend
        run: pnpm build

  client:
    name: 客户端 · 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: client
        run: flutter pub get
      - name: flutter analyze
        working-directory: client
        run: flutter analyze
      - name: flutter test
        working-directory: client
        run: flutter test






