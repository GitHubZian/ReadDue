spring:
  application:
    name: readdue-backend
  profiles:
    active: local

  # ---------- MVC / SSE ----------
  mvc:
    async:
      request-timeout: 300000

  # ---------- Jackson ----------
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # ---------- 数据库迁移 ----------
  # 现有库已由 schema.sql 建好，baseline 到 v1 后只增量执行 v2+；
  # 全新库从 v1 完整建表。禁止手工改历史迁移。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: schema.sql baseline (V1.1)
    validate-on-migrate: true
    out-of-order: false

  # ---------- RabbitMQ ----------
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 500ms
        max-attempts: 3
    listener:
      simple:
        # 手动 ack：只有业务落库成功才 ack，失败进 DLQ，不静默丢消息
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 1
        max-concurrency: 4
        default-requeue-rejected: false

  # ---------- 数据源（url / 账号 / 密码在 profile 中） ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

# ---------- 服务 ----------
server:
  port: 8125
  servlet:
    context-path: /api
    session:
      timeout: 12h
  tomcat:
    connection-timeout: 300000

# ---------- MyBatis-Plus ----------
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      # 全库主键使用雪花 id；自 V4 起数据库不再有 AUTO_INCREMENT，手写 INSERT 必须显式带 id
      id-type: assign_id
      # 逻辑删除：deleted=0 未删除；删除时写入本行主键，唯一索引带 deleted
      logic-delete-field: deleted
      logic-delete-value: "id"
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 读模型用 record 行对象承接 @Select 结果：按构造器参数名与结果列一一匹配
    arg-name-based-constructor-auto-mapping: true
    # 枚举字段在 PO 中暂以字符串落库，领域枚举在 domain 层转换
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.zian.backend: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# ---------- 运维探针 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ---------- 应用自有配置 ----------
app:
  jwt:
    # 本地开发密钥；生产必须用环境变量 APP_JWT_SECRET 覆盖
    secret: ${APP_JWT_SECRET:readdue-dev-secret-key-please-change-in-production-2026}
    issuer: readdue
    # access token 有效期：2 小时
    ttl-seconds: 7200
  outbox:
    # 本地消息表投递器扫描间隔与批量
    poll-interval-ms: 2000
    batch-size: 50
    max-retry: 5
  notify:
    # 免打扰时段默认值（rule_param 缺失时兜底）
    quiet-start: "22:00"
    quiet-end: "08:00"
  mail:
    # 本地 SMTP 见 application-local.yml；账号与授权码只走环境变量 MAIL_USERNAME / MAIL_PASSWORD
    from: ${MAIL_USERNAME:no-reply@readdue.local}
  demo:
    # 仅在 local profile 且该开关为 true 时装载演示数据；非 local 环境务必保持 false
    enabled: false

# ---------- SpringDoc / OpenAPI ----------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: default
      packages-to-scan: com.zian.backend
