server:
  # 部署在 Nginx 之后：按 X-Forwarded-* 解析真实客户端地址与协议
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/readdue?useUnicode=true&characterEncoding=utf-8&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:readdue}
    password: ${DB_PASSWORD:readdue}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      timeout: 3s
  session:
    redis:
      namespace: readdue:session
      flush-mode: on_save
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  demo:
    enabled: false
  file:
    storage-dir: ${FILE_STORAGE_DIR:/data/uploads}
  mail:
    from: ${MAIL_FROM:no-reply@readdue.local}
  cors:
    # 生产默认只允许同源部署的前端；跨域部署时用 CORS_ALLOWED_ORIGINS 显式列出
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# 生产关闭接口文档与指标端点，避免暴露内部结构
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    com.zian.backend: INFO
