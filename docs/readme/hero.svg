<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" aria-labelledby="t d">
  <title id="t">阅有期：高校图书馆借阅到期与归还小管家</title>
  <desc id="d">到期日、宽限依据与申诉进度集中呈现；右侧是一张借阅到期单与逾期章。</desc>
  <rect width="1200" height="470" fill="#F7F3EA"/>

  <!-- 品牌 -->
  <rect x="64" y="52" width="34" height="34" rx="6" fill="#163A2E"/>
  <text x="81" y="76" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="20" fill="#F7F3EA">阅</text>
  <text x="112" y="76" font-family="'Noto Serif SC','Songti SC',serif" font-size="22" font-weight="700" fill="#1D2723">阅有期</text>

  <!-- 标题 -->
  <text x="64" y="196" font-family="'Noto Serif SC','Songti SC',serif" font-size="84" font-weight="900" fill="#1D2723" letter-spacing="2">借的书，</text>
  <text x="64" y="288" font-family="'Noto Serif SC','Songti SC',serif" font-size="84" font-weight="900" fill="#1D2723" letter-spacing="2">别过期。</text>

  <text x="66" y="342" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="21" fill="#33403A">到期日、宽限依据、申诉进度，在一个地方说清楚。</text>
  <text x="66" y="376" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="21" fill="#33403A">个性化自愿开启，规则对所有读者一致。</text>

  <!-- 到期单 -->
  <g transform="rotate(-2.2 930 235)">
    <rect x="730" y="70" width="404" height="318" rx="6" fill="#FFFDF7" stroke="#D8D2C2" stroke-width="2"/>
    <rect x="730" y="70" width="404" height="46" rx="6" fill="#ECE6D7"/>
    <rect x="730" y="104" width="404" height="12" fill="#ECE6D7"/>
    <text x="752" y="100" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="17" fill="#59615A">借阅到期单</text>
    <text x="1112" y="100" text-anchor="end" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="17" fill="#59615A">3 本在借</text>

    <text x="752" y="164" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="21" font-weight="700" fill="#1D2723">深入理解计算机系统</text>
    <text x="752" y="192" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="17" fill="#7A4B3A">应还 11 月 5 日 · 已逾期 20 天</text>
    <line x1="752" y1="208" x2="1112" y2="208" stroke="#E4DFD1" stroke-width="1"/>

    <text x="752" y="242" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="21" font-weight="700" fill="#1D2723">活着</text>
    <text x="752" y="270" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="17" fill="#2E6B55">已延至 11 月 15 日 · 宽限 +3 天</text>
    <line x1="752" y1="286" x2="1112" y2="286" stroke="#E4DFD1" stroke-width="1"/>

    <text x="752" y="320" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="21" font-weight="700" fill="#1D2723">算法导论</text>
    <text x="752" y="348" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="17" fill="#59615A">应还 1 月 3 日</text>

    <!-- 章 -->
    <g transform="rotate(-10 980 322)">
      <rect x="878" y="294" width="204" height="58" rx="3" fill="none" stroke="#A2432C" stroke-width="4" opacity="0.92"/>
      <text x="980" y="332" text-anchor="middle" font-family="'Noto Serif SC','Songti SC',serif" font-size="27" font-weight="700" fill="#A2432C" opacity="0.92">已逾期 20 天</text>
    </g>
  </g>

  <!-- 底栏 -->
  <line x1="64" y1="410" x2="1136" y2="410" stroke="#D8D2C2" stroke-width="1"/>
  <text x="64" y="440" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#59615A">读者端 Flutter · 管理端 React · 后端 Spring Boot</text>
  <text x="600" y="440" text-anchor="middle" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#59615A">后端 130 项测试 · 客户端 81 项测试</text>
  <text x="1136" y="440" text-anchor="end" font-family="'Noto Sans SC',system-ui,sans-serif" font-size="16" fill="#59615A">演示账号 2021001 / 123456</text>
</svg>

